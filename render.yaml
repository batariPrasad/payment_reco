# Render Blueprint: Postgres database + Express API (server/).
# Render dashboard > New > Blueprint > pick this repo and the branch to deploy.
# Values marked `sync: false` are asked for once in the dashboard (never stored in git).

databases:
  - name: payment-reco-db
    databaseName: payment_reco
    user: payment_reco_app
    region: singapore
    # The free Postgres plan is deleted after 30 days - use a paid plan for real data.
    plan: basic-256mb
    postgresMajorVersion: "16"
    # Only services inside Render can connect. To restore a dump from your own PC,
    # temporarily add your public IP here (or in the dashboard) and use the External URL.
    ipAllowList: []

services:
  - type: web
    name: payment-reco-api
    runtime: node
    region: singapore
    # `free` sleeps after 15 min idle (first request then takes ~50 s). Use `starter` or higher for always-on.
    plan: free
    rootDir: server
    # devDependencies are needed to compile TypeScript; `postbuild` copies the SQL migrations into dist/.
    buildCommand: npm install --include=dev && npm run build
    # Migrations are idempotent (tracked in schema_migrations) and also seed the first admin, so running
    # them on every start is safe. (preDeployCommand would be cleaner but is paid-plans only.)
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payment-reco-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: "24"
      - key: REQUIRE_OTP
        value: "false"
      # The web app's public URL (comma-separate several). Fill in after the client is deployed.
      - key: CLIENT_ORIGIN
        sync: false
      # First admin, created on first start only if the users table is empty.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: KWIKSHIP_BASE_URL
        value: https://api.gokwik.co/kwikship
      - key: KWIKSHIP_APP_ID
        sync: false
      - key: KWIKSHIP_APP_SECRET
        sync: false
      # Only needed if REQUIRE_OTP is turned on:
      # - key: SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_FROM
